<article class="event-card"><img [src]="event().image" [alt]="event().title"><div class="event-date"><strong>{{ event().date.split(' ')[0] }}</strong><small>{{ event().date.split(' ')[1] }}</small></div><div class="event-body"><span class="tag">{{ event().category }}</span><h3>{{ event().title }}</h3><p><i class="bi bi-geo-alt"></i> {{ event().venue }}</p><p>{{ event().description }}</p><a routerLink="/events" class="text-link">Event details <i class="bi bi-arrow-up-right"></i></a></div></article>
